<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axe Flow</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Inter;background:#071e2b;color:#fff;}
.container{max-width:900px;margin:auto;padding:20px;}
.logo{width:60px;border-radius:12px;}
.panel{background:#0f3e56;border-radius:20px;padding:20px;margin-bottom:20px;}
.btn{padding:10px 14px;border-radius:999px;border:none;font-weight:700;cursor:pointer;}
.btn-primary{background:#ff7f1f;color:#fff;}
.btn-secondary{background:#ffffff20;color:#fff;}
.step{background:#ffffff10;padding:12px;border-radius:12px;margin-bottom:10px;}
.locked{opacity:.4}
.done{background:#3dd08f30}
</style>
</head>

<body>
<div class="container">

<img src="images/axe-flow-cover.png" class="logo">

<h1>Axe Flow</h1>

<div class="panel">
<h2>Créer un dossier</h2>

<input id="debiteur" placeholder="Nom débiteur"><br><br>
<input id="amount" placeholder="Montant €"><br><br>

<label class="btn btn-secondary">
Facture impayée
<input type="file" id="invoiceFile" hidden>
</label>

<p id="invoiceStatus">Aucune facture</p>

<br>
<button class="btn btn-primary" onclick="createDossier()">Créer dossier</button>
</div>

<div class="panel">
<h2>Étapes automatiques</h2>
<div id="steps"></div>
</div>

<div class="panel">
<h2>Déposer preuve</h2>

<input type="file" id="proofFile"><br><br>
<button class="btn btn-primary" onclick="uploadProof()">Déposer</button>

<p id="proofStatus"></p>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyCPbY...",
authDomain:"axe-flow.firebaseapp.com",
projectId:"axe-flow"
});

const db = getFirestore(app);

let dossier = null;

const steps = [
"Relance 1",
"Relance 2",
"Relance 3",
"Mise en demeure",
"Injonction"
];

function render(){
const el = document.getElementById("steps");
el.innerHTML="";

steps.forEach((s,i)=>{
el.innerHTML+=`
<div class="step">
${s}
<br><br>
<button onclick="generate(${i})" class="btn btn-primary">Télécharger</button>
</div>
`;
});
}

window.createDossier = async ()=>{
const debiteur = document.getElementById("debiteur").value;
const amount = document.getElementById("amount").value;

if(!debiteur || !amount){
alert("Remplis les champs");
return;
}

dossier = {
debiteur,
amount,
createdAt: Date.now()
};

await setDoc(doc(db,"test","dossier"), dossier);

render();
};

window.generate = (i)=>{
const text = `
Relance ${i+1}

Client : ${dossier.debiteur}
Montant : ${dossier.amount} €

Merci de régler votre facture.
`;

const blob = new Blob([text], {type:"application/msword"});
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "relance.doc";
a.click();
};

window.uploadProof = ()=>{
const f = document.getElementById("proofFile").files[0];
if(!f){
alert("Ajoute un fichier");
return;
}
document.getElementById("proofStatus").innerText = "Preuve déposée";
};

</script>
</body>
</html>
