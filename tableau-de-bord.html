<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Axe Flow — Tableau de bord client</title>
  <meta name="description" content="Tableau de bord client Axe Flow : suivi dossier, documents, relances et injonction." />
  <meta name="robots" content="noindex,nofollow" />

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0b1f2a;
      color:#fff;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:20px;
    }

    h1{margin-bottom:10px;}

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:16px;
    }

    .card{
      background:#132f3f;
      padding:16px;
      border-radius:12px;
    }

    .full{grid-column:1/-1;}

    button{
      padding:10px 14px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      background:#ff7f1f;
      color:#fff;
      font-weight:bold;
    }

    input{
      width:100%;
      padding:8px;
      margin-top:6px;
      border-radius:6px;
      border:none;
    }

    .price{
      margin-top:10px;
      font-weight:bold;
      color:#ffd27a;
    }

  </style>
</head>

<body>
<div class="container">

<h1>Tableau de bord</h1>

<!-- PLAN -->
<div class="card full">
  <strong>Votre offre :</strong>
  <span id="planInfo">Chargement...</span>
</div>

<!-- DOSSIERS -->
<div class="card">
  <h3>Vos dossiers</h3>

  <button onclick="createNewDossier()">Nouveau dossier (49€)</button>

  <p style="margin-top:10px;">
    ou
  </p>

  <button onclick="subscribe()">Abonnement 89€/mois (3 dossiers inclus)</button>
</div>

<!-- SYNTHESE -->
<div class="card">
  <h3>Synthèse</h3>

  <div>Statut : <span id="status">—</span></div>
  <div>Prochaine échéance : <span id="deadline">—</span></div>
</div>

<!-- RELANCES -->
<div class="card full">
  <h3>Relances</h3>

  <button>Relance 1</button>
  <button>Relance 2</button>
  <button>Relance 3</button>
  <button>Mise en demeure</button>
</div>

<!-- INJONCTION -->
<div class="card full">
  <h3>Injonction de payer (Axe Flow)</h3>

  <input id="amount" type="number" placeholder="Montant de la facture (€)" />

  <label style="display:flex;gap:8px;margin-top:10px;">
    <input type="checkbox" id="urgent" />
    Traitement prioritaire 24h (+90€)
  </label>

  <div class="price" id="price">—</div>

  <p style="font-size:0.9rem;margin-top:10px;color:#ccc;">
    Les frais peuvent être demandés au débiteur dans la procédure.
  </p>

  <button style="margin-top:10px;" onclick="payInjunction()">
    Lancer l’injonction
  </button>
</div>
<script>
  const STRIPE_LINKS = {
    oneShot49: "#",
    monthly89: "#",
    inj85: "#",
    inj140: "#",
    inj247: "#",
    inj175: "#",
    inj230: "#",
    inj337: "#"
  };

  function calculateInjunctionPrice(amount, urgent) {
    if (amount < 128) return urgent ? 175 : 85;
    if (amount <= 1280) return urgent ? 230 : 140;
    return urgent ? 337 : 247;
  }

  function updatePrice() {
    const amount = Number(document.getElementById("amount").value || 0);
    const urgent = document.getElementById("urgent").checked;
    const price = amount > 0 ? calculateInjunctionPrice(amount, urgent) : null;

    document.getElementById("price").textContent =
      price ? `Tarif Axe Flow : ${price} €` : "Indiquez le montant de la facture.";
  }

  function payInjunction() {
    const amount = Number(document.getElementById("amount").value || 0);
    const urgent = document.getElementById("urgent").checked;

    if (!amount) {
      alert("Indique le montant de la facture.");
      return;
    }

    const price = calculateInjunctionPrice(amount, urgent);

    const link =
      price === 85 ? STRIPE_LINKS.inj85 :
      price === 140 ? STRIPE_LINKS.inj140 :
      price === 247 ? STRIPE_LINKS.inj247 :
      price === 175 ? STRIPE_LINKS.inj175 :
      price === 230 ? STRIPE_LINKS.inj230 :
      STRIPE_LINKS.inj337;

    window.location.href = link;
  }

  function createNewDossier() {
    window.location.href = STRIPE_LINKS.oneShot49;
  }

  function subscribe() {
    window.location.href = STRIPE_LINKS.monthly89;
  }

  document.getElementById("amount").addEventListener("input", updatePrice);
  document.getElementById("urgent").addEventListener("change", updatePrice);

  document.getElementById("planInfo").textContent =
    "Offre ponctuelle 49€ ou abonnement 89€/mois avec 3 dossiers inclus.";
</script>

</div>
</body>
</html>
